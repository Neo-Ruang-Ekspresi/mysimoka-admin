name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only builds and publishes the image. The server (43.163.117.147) pulls it
# itself: deploy/deploy.sh runs from cron, the same way SHD-Finance-Flow does.
# Nothing here holds credentials for the server.

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Pull requests only prove the image builds; publishing is in `release`.
        run: docker build -t mysimoka-admin:${{ github.sha }} .

  release:
    name: Publish image to GHCR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR repository names must be lowercase.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # deploy.sh pulls by commit SHA; `main` is only a convenience pointer.
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
