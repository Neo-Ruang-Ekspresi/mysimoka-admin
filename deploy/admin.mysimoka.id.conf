# Server block for the `nginx` reverse-proxy container on 43.163.117.147.
#
# Host path: /home/ubuntu/app/nginx/conf.d/admin.mysimoka.id.conf
# Apply:     docker exec nginx nginx -t && docker exec nginx nginx -s reload
#
# TLS: own webroot certificate (`admin.mysimoka.id`); the mysimoka.id certificate
# does not cover this subdomain. Issue it before enabling the 443 block, otherwise
# nginx refuses to load. See DEPLOY.md.
#
# Upstream resolved per request through Docker's DNS: the container IP changes
# on every deploy. Security headers come from the app container; HSTS only here.

server {
    listen 80;
    listen [::]:80;
    server_name admin.mysimoka.id;

    location /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
    }

    location / {
        return 301 https://admin.mysimoka.id$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.mysimoka.id;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/admin.mysimoka.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mysimoka.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mysimoka-admin.access.log;
    error_log  /var/log/nginx/mysimoka-admin.error.log;

    location / {
        set $mysimoka_admin_upstream mysimoka-admin:8080;
        proxy_pass http://$mysimoka_admin_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
