server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # `add_header` di dalam location menghapus header level server untuk location tsb,
    # jadi caching di bawah memakai `expires` saja (sama seperti mysimoka-web).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Auth service lewat origin yang sama (VITE_AUTH_BASE_URL=/_auth), karena
    # auth.mysimoka.sunhouse.co.id tidak mengirim header CORS untuk dashboard ini.
    # Upstream tetap (bukan open proxy); resolver = DNS Docker di jaringan nginx_net.
    location /_auth/ {
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $auth_upstream auth.mysimoka.sunhouse.co.id;
        rewrite ^/_auth/(.*)$ /$1 break;
        proxy_pass https://$auth_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name auth.mysimoka.sunhouse.co.id;
        proxy_set_header Host auth.mysimoka.sunhouse.co.id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        client_max_body_size 64k;
        expires -1;
    }

    # Aset Vite ber-hash → cache panjang.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback: semua route (mis. /sekolah/siswa) dilayani index.html.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
