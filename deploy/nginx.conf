server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # `add_header` di dalam location menghapus header level server untuk location tsb,
    # jadi caching di bawah memakai `expires` saja (sama seperti mysimoka-web).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Aset Vite ber-hash → cache panjang.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback: semua route (mis. /sekolah/siswa) dilayani index.html.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
